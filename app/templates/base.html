<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
    <title>{% block title %}Траты{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Траты">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #eef0ec;
            --surface: #ffffff;
            --surface-2: #f5f6f3;
            --line: #e2e5df;
            --text: #17201b;
            --muted: #6b746e;
            --accent: #0e7c66;
            --accent-ink: #ffffff;
            --accent-soft: #dff1eb;
            --danger: #c2410c;
            --danger-soft: #fdeee6;
            --shadow: 0 1px 2px rgba(23, 32, 27, .05), 0 6px 20px rgba(23, 32, 27, .06);
            --sheet-shadow: 0 -10px 40px rgba(23, 32, 27, .18);
            --radius: 20px;

            --c-food: #2f9e44; --c-cafe: #e8590c; --c-transport: #f0a500; --c-auto: #1c7ed6;
            --c-home: #7048e8; --c-health: #e03131; --c-beauty: #d6336c; --c-clothes: #0c8599;
            --c-tech: #4263eb; --c-alco: #9c36b5; --c-fun: #f76707; --c-net: #1098ad;
            --c-other: #868e96;
            --c-cat: #74b816;
            --c-house: #20c997;
            --cat-outline: #1b1b1d;
            --bar-muted: #c9d3ce;
            --bar-hover: #a9b8b1;

            --font: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #0d1210;
                --surface: #161d1a;
                --surface-2: #1c2521;
                --line: #26302b;
                --text: #e8ece9;
                --muted: #8f9a94;
                --accent: #34c79f;
                --accent-ink: #062019;
                --accent-soft: #143329;
                --danger: #fb8c5a;
                --danger-soft: #33190f;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
                --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
                --cat-outline: #7d8984;
                --bar-muted: #34403b;
                --bar-hover: #4a5852;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.45 var(--font);
            -webkit-font-smoothing: antialiased;
            padding: env(safe-area-inset-top, 0px) 16px 0;
        }
        body.with-tabbar { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

        .page { max-width: 640px; margin: 0 auto; padding-top: 20px; }

        .num, .money, td { font-variant-numeric: tabular-nums; }
        .cents { color: var(--muted); font-weight: inherit; }
        button, input, select, textarea { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- bottom navigation ---------- */
        .tabbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(to top, var(--bg) 70%, transparent);
        }
        .tabbar nav {
            max-width: 640px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 5px;
        }
        .tabbar a, .tabbar button {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px; border-radius: 14px; border: 0; background: none; cursor: pointer;
            text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px;
        }
        .tabbar a.on { background: var(--accent-soft); color: var(--accent); }
        .tabbar button:hover { color: var(--text); }
        .tabbar svg { width: 20px; height: 20px; flex: none; }
        .tabbar form { display: contents; }
        @media (max-width: 420px) {
            .tabbar a { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; }
        }

        /* ---------- shared components ---------- */
        .btn {
            font-weight: 600; font-size: 0.95rem;
            border-radius: 14px; padding: 0.6rem 1rem; border: 1px solid transparent; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            text-decoration: none;
            transition: transform .08s ease, filter .15s ease, background .15s ease;
        }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .6; cursor: default; }
        .btn-primary { background: var(--accent); color: var(--accent-ink); }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
        .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
        .btn-ghost { background: transparent; color: var(--muted); }
        .btn-ghost:hover { color: var(--text); }
        .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.82rem; border-radius: 10px; }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.1rem;
            margin-bottom: 1rem;
        }

        h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 1rem; text-wrap: balance; }
        h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }

        input[type=text], input[type=password], input[type=number],
        input[type=date], input[type=month], input[type=file], select, textarea {
            width: 100%;
            font-size: 0.95rem;
            padding: 0.6rem 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

        .field { margin-bottom: 0.85rem; }
        .field-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .field-row .field { flex: 1; min-width: 140px; }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid var(--line);
        }
        td { padding: 0.6rem; border-bottom: 1px solid var(--line); }
        tr:last-child td { border-bottom: none; }


        .empty-state { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }

        .error {
            color: var(--danger);
            background: var(--danger-soft);
            border-radius: 12px;
            padding: 0.6rem 0.9rem;
            font-size: 0.9rem;
            margin: 0 0 1rem;
        }

        .muted { color: var(--muted); font-size: 0.85rem; }

        .cat-icon { display: inline-block; vertical-align: -0.15em; }
        /* Emoji glyphs fill more of their box than the SVG; even them out in icon tiles. */
        .ico .cat-icon, .chip .cat-icon { width: 1.3em; height: 1.3em; }

        /* ---------- month header (home + dashboard) ---------- */
        .month-switch { display: flex; align-items: center; gap: 2px; font-weight: 600; }
        .month-switch a, .month-switch span.off {
            width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
            color: var(--muted); font-size: 20px; text-decoration: none;
        }
        .month-switch a:hover { background: var(--surface-2); color: var(--text); }
        .month-switch span.off { opacity: .3; }
        /* Spending going up is the bad direction. */
        .delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
        .delta.down { color: var(--accent); }
        .delta.up { color: var(--danger); }

        /* ---------- months chart (_months_chart.html): one series, selected month in the accent ---------- */
        .chart { --plot-h: 180px; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; }
        .y-axis { position: relative; height: var(--plot-h); min-width: 3.2em; }
        .y-axis span {
            position: absolute; right: 0; transform: translateY(50%);
            font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .plot { position: relative; height: var(--plot-h); }
        .gridline { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
        .cols { position: absolute; inset: 0; display: grid; }
        .col {
            position: relative; display: flex; justify-content: center; align-items: flex-end;
            text-decoration: none; color: inherit; border-radius: 10px; outline-offset: 0;
        }
        .col:hover { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
        .bar {
            width: min(24px, 60%); border-radius: 4px 4px 0 0;
            background: var(--bar-muted); transition: background .15s ease;
        }
        .col.on .bar { background: var(--accent); }
        .col:hover .bar { background: var(--bar-hover); }
        .col.on:hover .bar { background: var(--accent); }
        .cap {
            position: absolute; left: 50%; transform: translate(-50%, -6px);
            font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
        }
        .tip {
            position: absolute; left: 50%; transform: translate(-50%, -10px); z-index: 3;
            background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 10px;
            font-size: 12px; line-height: 1.35; white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity .12s ease;
        }
        .tip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
        .tip .cents { color: inherit; opacity: .7; }
        .col:first-child .tip { left: 0; transform: translate(0, -10px); }
        .col:last-child .tip { left: auto; right: 0; transform: translate(0, -10px); }
        .col:hover .tip, .col:focus-visible .tip { opacity: 1; }
        .col:hover .cap, .col:focus-visible .cap { opacity: 0; }
        .x-axis { grid-column: 2; display: grid; margin-top: 6px; }
        .x-axis span { text-align: center; font-size: 12px; color: var(--muted); }
        .x-axis span.on { color: var(--text); font-weight: 700; }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* ---------- secondary pages (budgets, prices, import…) ---------- */
        .sub-page { display: flex; flex-direction: column; gap: 14px; }
        .sub-page .back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; align-self: flex-start; }
        .sub-page .back:hover { color: var(--text); }
        .panel { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; }
        .panel h2 { font-size: 15px; margin: 0 0 4px; }
        .panel .lead { font-size: 13px; color: var(--muted); margin: 0 0 12px; max-width: 62ch; }
        .panel > :last-child { margin-bottom: 0; }
        .list-row {
            display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
            padding: 10px 0; border-top: 1px solid var(--line);
        }
        .list-row:first-of-type { border-top: 0; }
        .list-row .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .list-row .m { font-size: 13px; color: var(--muted); }
        .pill {
            display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 8px;
            background: var(--surface-2); color: var(--muted); white-space: nowrap;
        }
        .pill.good { background: var(--accent-soft); color: var(--accent); }
        .pill.bad { background: var(--danger-soft); color: var(--danger); }

        /* ---------- login ---------- */
        .login-shell { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 360px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
{% set logged_in = request.session.get('user') %}
<body class="{{ 'with-tabbar' if logged_in else '' }}">
<div class="page">
    {% block content %}{% endblock %}
</div>
{% if logged_in %}
<div class="tabbar">
    <nav>
        <a href="/" class="{{ 'on' if request.url.path == '/' else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
            Траты
        </a>
        <a href="/dashboard" class="{{ 'on' if request.url.path == '/dashboard' else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
            Дашборд
        </a>
        <a href="/search" class="{{ 'on' if request.url.path == '/search' else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            Поиск
        </a>
        {% set more_paths = ['/more', '/budgets', '/import', '/rules', '/forecast', '/usage'] %}
        <a href="/more" class="{{ 'on' if request.url.path in more_paths or request.url.path.startswith('/import') else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
            Ещё
        </a>
    </nav>
</div>
{% endif %}
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
    // Prevent double-submit (e.g. clicking a submit button twice while the
    // request is in flight), which would otherwise create duplicate records.
    document.addEventListener('submit', function (e) {
        var form = e.target;
        // Cancelled (e.g. "no" in a confirm()) or handled by htmx: not a page submit.
        if (form.dataset.submitted !== '1' && e.defaultPrevented) return;
        if (form.dataset.submitted === '1') {
            e.preventDefault();
            return;
        }
        form.dataset.submitted = '1';
        form.querySelectorAll('button[type=submit], button:not([type])').forEach(function (btn) {
            btn.disabled = true;
        });
    });
    // Coming back via the browser's back button restores the page from cache
    // with its buttons still disabled.
    window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        document.querySelectorAll('form[data-submitted]').forEach(function (form) {
            delete form.dataset.submitted;
            form.querySelectorAll('button').forEach(function (btn) { btn.disabled = false; });
        });
    });
</script>
</body>
</html>
