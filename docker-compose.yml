services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - "8000"
    # No "ports:" here on purpose — the app is reachable only inside the
    # docker network, via nginx. Nothing but nginx talks to it directly.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx:alpine's entrypoint runs envsubst over *.template files here,
      # substituting ${DOMAIN}, and writes the result into conf.d/.
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew loop: check twice a day, certbot itself only actually renews
    # when a cert is within 30 days of expiring.
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
