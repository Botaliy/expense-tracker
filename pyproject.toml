[project]
name = "expense-tracker"
version = "0.1.0"
description = "Personal expense tracker with AI receipt recognition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.6",
    "pillow>=12.3.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
